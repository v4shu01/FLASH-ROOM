<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FLASH — Private Group Chat & Calls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06070b;
      --surface: #10131c;
      --surface-2: #171c29;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --muted: #8b95a5;
      --primary: #7c3aed;
      --primary-glow: rgba(124, 58, 237, 0.35);
      --accent: #06b6d4;
      --green: #10b981;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ================= LOGIN SCREEN ================= */
    .auth-wrapper {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 22px 18px 24px;
      background:
        radial-gradient(circle at 20% 10%, rgba(124, 58, 237, 0.22), transparent 42%),
        radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.16), transparent 45%),
        var(--bg);
    }

    .brand-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }

    .logo-box {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
      box-shadow: 0 8px 24px var(--primary-glow);
    }

    .brand-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .login-card {
      width: 100%;
      max-width: 410px;
      background: rgba(16, 19, 28, 0.88);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 26px 22px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.75);
      margin: auto 0;
    }

    .login-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .login-sub {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 22px;
      line-height: 1.45;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 7px;
      letter-spacing: 0.02em;
    }

    .input-group input {
      width: 100%;
      padding: 13.5px 15px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: #090b11;
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-group input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.18);
    }

    .err-msg {
      color: #fb7185;
      font-size: 13px;
      font-weight: 500;
      min-height: 18px;
      margin-bottom: 10px;
    }

    .join-btn {
      width: 100%;
      padding: 14.5px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 50%, #06b6d4 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(124, 58, 237, 0.35);
      transition: transform 0.15s ease;
    }

    .join-btn:active {
      transform: scale(0.98);
    }

    .creator-footer {
      text-align: center;
      padding-top: 16px;
    }

    .creator-name {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .ig-logo-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.16s ease, background 0.2s ease;
    }

    .ig-logo-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    /* ================= CHAT APP SCREEN ================= */
    .chat-app {
      display: none;
      flex-direction: column;
      height: 100dvh;
      max-width: 720px;
      margin: 0 auto;
      background: #080a10;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 15px;
      background: linear-gradient(180deg, rgba(20, 25, 38, 0.98), rgba(13, 16, 25, 0.95));
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      z-index: 10;
    }

    .room-meta {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .room-avatar {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 17px;
      color: #fff;
      box-shadow: 0 6px 18px rgba(124, 58, 237, 0.3);
      flex-shrink: 0;
    }

    .room-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .room-status {
      font-size: 12px;
      color: var(--green);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .online-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      flex-shrink: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 39px;
      height: 39px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(255, 255, 255, 0.04);
      color: #f8fafc;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    .icon-btn.leave-btn {
      color: #fb7185;
      border-color: rgba(251, 113, 133, 0.2);
      background: rgba(251, 113, 133, 0.07);
    }

    .messages-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      background:
        radial-gradient(circle at 15% 15%, rgba(124, 58, 237, 0.09), transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(6, 182, 212, 0.07), transparent 45%),
        #080a10;
    }

    .messages-box::-webkit-scrollbar {
      width: 4px;
    }

    .messages-box::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
    }

    .sys-pill {
      align-self: center;
      font-size: 11.5px;
      font-weight: 500;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      padding: 5px 13px;
      border-radius: 999px;
      margin: 4px 0;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      animation: msgPop 0.16s ease-out;
    }

    @keyframes msgPop {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.me {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-row.other {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-sender {
      font-size: 11.5px;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 4px;
      padding: 0 5px;
    }

    .msg-bubble {
      padding: 11px 14px;
      border-radius: 19px;
      font-size: 14.5px;
      line-height: 1.45;
      word-break: break-word;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }

    .msg-row.me .msg-bubble {
      background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
      color: #ffffff;
      border-bottom-right-radius: 5px;
    }

    .msg-row.other .msg-bubble {
      background: rgba(23, 28, 42, 0.92);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom-left-radius: 5px;
    }

    .media-img {
      max-width: 235px;
      max-height: 270px;
      border-radius: 13px;
      display: block;
      margin-bottom: 5px;
      object-fit: cover;
    }

    .media-vid {
      max-width: 245px;
      max-height: 270px;
      border-radius: 13px;
      display: block;
      margin-bottom: 5px;
      background: #000;
    }

    .doc-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 13px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-decoration: none;
      color: #fff;
      margin-bottom: 4px;
    }

    .doc-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(6, 182, 212, 0.2);
      color: #38bdf8;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .doc-meta {
      min-width: 0;
    }

    .doc-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }

    .doc-sub {
      font-size: 10.5px;
      color: rgba(255, 255, 255, 0.68);
    }

    .msg-time {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.62);
      margin-top: 4px;
      text-align: right;
    }

    .chat-input-bar {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px 13px;
      background: rgba(14, 17, 27, 0.96);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .attach-btn {
      width: 41px;
      height: 41px;
      border-radius: 13px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(255, 255, 255, 0.04);
      color: #e2e8f0;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .chat-input-bar input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 11.5px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #07090f;
      color: #fff;
      font-size: 14.5px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .chat-input-bar input[type="text"]:focus {
      border-color: #8b5cf6;
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      border: none;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 6px 18px rgba(124, 58, 237, 0.32);
    }

    /* ================= INCOMING CALL MODAL ================= */
    .ring-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 12, 0.86);
      backdrop-filter: blur(16px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .ring-card {
      width: 100%;
      max-width: 340px;
      background: #131724;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
    }

    .ring-avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      display: grid;
      place-items: center;
      font-size: 30px;
      font-weight: 800;
      animation: pulseRing 1.4s infinite;
    }

    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.65); }
      70% { box-shadow: 0 0 0 22px rgba(124, 58, 237, 0); }
      100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0); }
    }

    .ring-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .ring-type {
      font-size: 13.5px;
      color: #a78bfa;
      margin-bottom: 28px;
    }

    .ring-actions {
      display: flex;
      justify-content: center;
      gap: 34px;
    }

    .ring-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: none;
      display: grid;
      place-items: center;
      color: #fff;
      cursor: pointer;
    }

    .ring-btn.decline {
      background: var(--red);
      box-shadow: 0 10px 24px rgba(239, 68, 68, 0.4);
    }

    .ring-btn.accept {
      background: var(--green);
      box-shadow: 0 10px 24px rgba(16, 185, 129, 0.4);
    }

    #callOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #06070b;
      z-index: 1500;
      flex-direction: column;
    }

    #zegoContainer {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- 1. LOGIN SCREEN -->
  <div class="auth-wrapper" id="loginScreen">
    <div class="brand-top">
      <div class="logo-box">⚡</div>
      <div class="brand-name">FLASH ROOM</div>
    </div>

    <div class="login-card">
      <h1 class="login-title">Private Group Lounge</h1>
      <p class="login-sub">Room ID, Room Password aur apna naam daal kar enter karein.</p>

      <div class="input-group">
        <label for="roomIdInput">Room ID</label>
        <input type="text" id="roomIdInput" autocomplete="off" />
      </div>

      <div class="input-group">
        <label for="roomPassInput">Room Password</label>
        <input type="password" id="roomPassInput" autocomplete="off" />
      </div>

      <div class="input-group">
        <label for="userNameInput">Your Name</label>
        <input type="text" id="userNameInput" autocomplete="off" />
      </div>

      <div class="err-msg" id="loginError"></div>
      <button class="join-btn" id="enterBtn" onclick="enterRoom()">Enter Room</button>
    </div>

    <footer class="creator-footer">
      <div class="creator-name">Created by Vishal Sahani</div>
      <a class="ig-logo-btn" href="https://www.instagram.com/__v4shu.02" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <defs>
            <linearGradient id="igGrad" x1="2" y1="22" x2="22" y2="2" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#f58529"/>
              <stop offset="50%" stop-color="#dd2a7b"/>
              <stop offset="100%" stop-color="#8134af"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="20" height="20" rx="6" stroke="url(#igGrad)" stroke-width="2.2"/>
          <circle cx="12" cy="12" r="4.5" stroke="url(#igGrad)" stroke-width="2.2"/>
          <circle cx="17.5" cy="6.5" r="1.3" fill="#dd2a7b"/>
        </svg>
      </a>
    </footer>
  </div>

  <!-- 2. GROUP CHAT SCREEN -->
  <div class="chat-app" id="chatScreen">
    <header class="chat-header">
      <div class="room-meta">
        <div class="room-avatar" id="roomAvatar">R</div>
        <div>
          <div class="room-title" id="headerRoomName">Room</div>
          <div class="room-status"><span class="online-dot"></span> <span id="onlineCount">Connecting...</span></div>
        </div>
      </div>

      <div class="header-actions">
        <button class="icon-btn" title="Voice Call" onclick="initiateCall('voice')">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        </button>

        <button class="icon-btn" title="Video Call" onclick="initiateCall('video')">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="23 7 16 12 23 17 23 7"/>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
          </svg>
        </button>

        <button class="icon-btn leave-btn" title="Leave Room" onclick="leaveRoom()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="messages-box" id="messagesBox"></div>

    <input
      type="file"
      id="mediaPicker"
      accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip,.rar"
      style="display:none"
      onchange="handleMediaSelect(event)"
    />

    <form class="chat-input-bar" onsubmit="sendMessage(event)">
      <button type="button" class="attach-btn" title="Send Photo, Video or Document" onclick="document.getElementById('mediaPicker').click()">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>

      <input type="text" id="msgInput" autocomplete="off" />

      <button type="submit" class="send-btn" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </form>
  </div>

  <!-- 3. INCOMING CALL RING POPUP -->
  <div class="ring-overlay" id="incomingCallModal">
    <div class="ring-card">
      <div class="ring-avatar" id="callerAvatar">U</div>
      <div class="ring-title" id="callerNameText">Incoming Call</div>
      <div class="ring-type" id="callTypeText">Voice Call...</div>

      <div class="ring-actions">
        <button class="ring-btn decline" onclick="rejectIncomingCall()" title="Cut">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate(135deg);">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        </button>

        <button class="ring-btn accept" onclick="acceptIncomingCall()" title="Accept">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 4. ACTIVE GROUP CALL SCREEN -->
  <div id="callOverlay">
    <div id="zegoContainer"></div>
  </div>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>

  <script>
    const appID = 927960764;
    const serverSecret = "ae69f441dadbf65f371a5f3eadb798d7";

    let currentUser = "";
    let currentUserId = "u_" + Math.random().toString(36).substring(2, 10);
    let rawRoomId = "";
    let rawRoomPass = "";
    let secretChannelKey = "";
    let mqttClient = null;
    let heartbeatTimer = null;
    let membersMap = new Map();
    let pendingCallMode = "voice";
    let ringTimer = null;
    let audioCtx = null;
    let zpInstance = null;
    let isEntering = false;

    window.addEventListener("error", (ev) => {
      ev.preventDefault();
    });

    window.addEventListener("unhandledrejection", (ev) => {
      ev.preventDefault();
    });

    async function buildRoomHash(rId, rPass) {
      const text = rId.trim().toLowerCase() + "::" + rPass.trim();
      if (window.crypto && window.crypto.subtle) {
        const msgUint8 = new TextEncoder().encode(text);
        const hashBuffer = await crypto.subtle.digest("SHA-256", msgUint8);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 24);
      }
      let h = 0;
      for (let i = 0; i < text.length; i++) {
        h = ((h << 5) - h) + text.charCodeAt(i);
        h |= 0;
      }
      return "room_" + Math.abs(h).toString(16);
    }

    async function enterRoom() {
      if (isEntering) return;
      const rId = document.getElementById("roomIdInput").value.trim();
      const rPass = document.getElementById("roomPassInput").value.trim();
      const uName = document.getElementById("userNameInput").value.trim();
      const errEl = document.getElementById("loginError");
      const btnEl = document.getElementById("enterBtn");

      if (!rId) {
        errEl.textContent = "Room ID daalna zaroori hai.";
        return;
      }
      if (!rPass) {
        errEl.textContent = "Room Password daalna zaroori hai.";
        return;
      }
      if (!uName) {
        errEl.textContent = "Your Name daalna zaroori hai.";
        return;
      }

      isEntering = true;
      btnEl.disabled = true;
      errEl.textContent = "";

      try {
        rawRoomId = rId;
        rawRoomPass = rPass;
        currentUser = uName;
        secretChannelKey = await buildRoomHash(rId, rPass);

        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("chatScreen").style.display = "flex";
        document.getElementById("headerRoomName").textContent = rawRoomId;
        document.getElementById("roomAvatar").textContent = rawRoomId.charAt(0).toUpperCase();

        connectRealtimeChat();
      } catch (e) {
        btnEl.disabled = false;
        isEntering = false;
      }
    }

    function connectRealtimeChat() {
      const topic = "flashroom/v3/" + secretChannelKey;
      membersMap.set(currentUserId, currentUser);
      updateOnlineBadge();
      addSystemMessage("Joined room \"" + rawRoomId + "\"");

      function setupSocket() {
        try {
          if (mqttClient) {
            mqttClient.removeAllListeners();
            mqttClient.end(true);
          }
          mqttClient = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
            clientId: "flash_" + currentUserId + "_" + Math.random().toString(36).substring(2, 6),
            clean: true,
            reconnectPeriod: 1500
          });

          mqttClient.on("connect", () => {
            mqttClient.subscribe(topic, { qos: 1 });
            membersMap.set(currentUserId, currentUser);
            updateOnlineBadge();

            publishPayload({
              type: "join",
              senderId: currentUserId,
              sender: currentUser
            });
          });

          mqttClient.on("error", () => {});

          mqttClient.on("message", (t, message) => {
            try {
              const data = JSON.parse(message.toString());
              if (!data || !data.type) return;

              if (data.type === "join") {
                const isNew = !membersMap.has(data.senderId);
                membersMap.set(data.senderId, data.sender || "Member");
                updateOnlineBadge();
                if (data.senderId !== currentUserId && isNew) {
                  addSystemMessage((data.sender || "Member") + " joined");
                  publishPayload({
                    type: "heartbeat",
                    senderId: currentUserId,
                    sender: currentUser
                  });
                }
              } else if (data.type === "heartbeat") {
                const isNew = !membersMap.has(data.senderId);
                membersMap.set(data.senderId, data.sender || "Member");
                updateOnlineBadge();
                if (data.senderId !== currentUserId && isNew) {
                  addSystemMessage((data.sender || "Member") + " joined");
                }
              } else if (data.type === "leave") {
                if (membersMap.has(data.senderId)) {
                  const name = membersMap.get(data.senderId);
                  membersMap.delete(data.senderId);
                  updateOnlineBadge();
                  if (data.senderId !== currentUserId) {
                    addSystemMessage(name + " left");
                  }
                }
              } else if (data.type === "chat") {
                appendChatBubble(data.sender, data.text, data.time, data.senderId === currentUserId, null);
              } else if (data.type === "media") {
                appendChatBubble(data.sender, "", data.time, data.senderId === currentUserId, {
                  kind: data.kind,
                  dataUrl: data.dataUrl,
                  fileName: data.fileName
                });
              } else if (data.type === "call_ring") {
                if (data.senderId !== currentUserId) {
                  showIncomingCall(data.sender, data.mode);
                }
              } else if (data.type === "call_reject") {
                if (data.senderId !== currentUserId) {
                  addSystemMessage((data.sender || "Member") + " declined the call");
                }
              }
            } catch (e) {}
          });
        } catch (e) {}
      }

      setupSocket();

      if (heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(() => {
        membersMap.set(currentUserId, currentUser);
        updateOnlineBadge();
        if (mqttClient && mqttClient.connected) {
          publishPayload({
            type: "heartbeat",
            senderId: currentUserId,
            sender: currentUser
          });
        } else {
          setupSocket();
        }
      }, 3000);
    }

    function publishPayload(obj) {
      if (mqttClient && mqttClient.connected) {
        try {
          mqttClient.publish("flashroom/v3/" + secretChannelKey, JSON.stringify(obj), { qos: 1 });
        } catch (e) {}
      }
    }

    function updateOnlineBadge() {
      const count = Math.max(1, membersMap.size);
      const names = Array.from(membersMap.values()).join(", ");
      document.getElementById("onlineCount").textContent = count + " online • " + names;
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (!text) return;

      const timeStr = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      publishPayload({
        type: "chat",
        senderId: currentUserId,
        sender: currentUser,
        text: text,
        time: timeStr
      });
      input.value = "";
    }

    function handleMediaSelect(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const isVideo = file.type.startsWith("video/");
      const isImage = file.type.startsWith("image/");
      const kind = isVideo ? "video" : (isImage ? "image" : "doc");

      const maxBytes = isVideo ? 900 * 1024 : 1.2 * 1024 * 1024;
      if (file.size > maxBytes) {
        addSystemMessage(isVideo ? "Chhota video (900KB se kam) chunein." : "1.2MB se chhoti file chunein.");
        e.target.value = "";
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        const timeStr = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        publishPayload({
          type: "media",
          senderId: currentUserId,
          sender: currentUser,
          kind: kind,
          fileName: file.name || "document",
          dataUrl: reader.result,
          time: timeStr
        });
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    }

    function appendChatBubble(sender, text, time, isMe, media) {
      const box = document.getElementById("messagesBox");
      const row = document.createElement("div");
      row.className = "msg-row " + (isMe ? "me" : "other");

      if (!isMe) {
        const nameTag = document.createElement("div");
        nameTag.className = "msg-sender";
        nameTag.textContent = sender || "Member";
        row.appendChild(nameTag);
      }

      const bubble = document.createElement("div");
      bubble.className = "msg-bubble";

      if (media && media.kind === "image") {
        const img = document.createElement("img");
        img.className = "media-img";
        img.src = media.dataUrl;
        img.alt = "photo";
        bubble.appendChild(img);
      } else if (media && media.kind === "video") {
        const vid = document.createElement("video");
        vid.className = "media-vid";
        vid.src = media.dataUrl;
        vid.controls = true;
        vid.playsInline = true;
        bubble.appendChild(vid);
      } else if (media && media.kind === "doc") {
        const docLink = document.createElement("a");
        docLink.className = "doc-card";
        docLink.href = media.dataUrl;
        docLink.download = media.fileName || "document";

        const ext = ((media.fileName || "FILE").split(".").pop() || "DOC").toUpperCase().slice(0, 4);
        const icon = document.createElement("div");
        icon.className = "doc-icon";
        icon.textContent = ext;

        const meta = document.createElement("div");
        meta.className = "doc-meta";

        const dName = document.createElement("div");
        dName.className = "doc-name";
        dName.textContent = media.fileName || "Document";

        const dSub = document.createElement("div");
        dSub.className = "doc-sub";
        dSub.textContent = "Tap to download";

        meta.appendChild(dName);
        meta.appendChild(dSub);
        docLink.appendChild(icon);
        docLink.appendChild(meta);
        bubble.appendChild(docLink);
      }

      if (text) {
        const txtSpan = document.createElement("div");
        txtSpan.textContent = text;
        bubble.appendChild(txtSpan);
      }

      const timeDiv = document.createElement("div");
      timeDiv.className = "msg-time";
      timeDiv.textContent = time || "";
      bubble.appendChild(timeDiv);

      row.appendChild(bubble);
      box.appendChild(row);
      box.scrollTop = box.scrollHeight;
    }

    function addSystemMessage(text) {
      const box = document.getElementById("messagesBox");
      const pill = document.createElement("div");
      pill.className = "sys-pill";
      pill.textContent = text;
      box.appendChild(pill);
      box.scrollTop = box.scrollHeight;
    }

    function startRingtone() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const playBeep = () => {
          if (!audioCtx) return;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(520, audioCtx.currentTime);
          osc.frequency.setValueAtTime(660, audioCtx.currentTime + 0.18);
          gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.55);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.55);
        };
        playBeep();
        ringTimer = setInterval(playBeep, 1500);
        if (navigator.vibrate) navigator.vibrate([300, 200, 300]);
      } catch (e) {}
    }

    function stopRingtone() {
      if (ringTimer) {
        clearInterval(ringTimer);
        ringTimer = null;
      }
      if (audioCtx) {
        audioCtx.close().catch(() => {});
        audioCtx = null;
      }
    }

    function showIncomingCall(callerName, mode) {
      pendingCallMode = mode;
      const safeName = callerName || "Member";
      document.getElementById("callerNameText").textContent = safeName;
      document.getElementById("callerAvatar").textContent = safeName.charAt(0).toUpperCase();
      document.getElementById("callTypeText").textContent =
        mode === "video" ? "Incoming Group Video Call..." : "Incoming Group Voice Call...";
      document.getElementById("incomingCallModal").style.display = "flex";
      startRingtone();
    }

    function rejectIncomingCall() {
      stopRingtone();
      document.getElementById("incomingCallModal").style.display = "none";
      publishPayload({
        type: "call_reject",
        senderId: currentUserId,
        sender: currentUser
      });
    }

    function acceptIncomingCall() {
      stopRingtone();
      document.getElementById("incomingCallModal").style.display = "none";
      startZegoCall(pendingCallMode);
    }

    function initiateCall(mode) {
      publishPayload({
        type: "call_ring",
        senderId: currentUserId,
        sender: currentUser,
        mode: mode
      });
      addSystemMessage("Started a " + (mode === "video" ? "Video Call" : "Voice Call"));
      startZegoCall(mode);
    }

    function startZegoCall(mode) {
      if (typeof ZegoUIKitPrebuilt === "undefined") {
        return;
      }

      try {
        const overlay = document.getElementById("callOverlay");
        const container = document.getElementById("zegoContainer");
        container.innerHTML = "";
        overlay.style.display = "flex";

        const isVideo = mode === "video";
        const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(
          appID,
          serverSecret,
          secretChannelKey,
          currentUserId,
          currentUser
        );

        zpInstance = ZegoUIKitPrebuilt.create(kitToken);
        zpInstance.joinRoom({
          container: container,
          scenario: {
            mode: ZegoUIKitPrebuilt.GroupCall,
          },
          showPreJoinView: false,
          turnOnMicrophoneWhenJoining: true,
          turnOnCameraWhenJoining: isVideo,
          showMyCameraToggleButton: isVideo,
          showAudioVideoSettingsButton: false,
          showScreenSharingButton: false,
          showTextChat: true,
          showUserList: true,
          onLeaveRoom: () => {
            overlay.style.display = "none";
            container.innerHTML = "";
          }
        });
      } catch (e) {
        document.getElementById("callOverlay").style.display = "none";
      }
    }

    function leaveRoom() {
      publishPayload({
        type: "leave",
        senderId: currentUserId,
        sender: currentUser
      });
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      if (mqttClient) mqttClient.end();
      location.reload();
    }

    window.addEventListener("beforeunload", () => {
      publishPayload({
        type: "leave",
        senderId: currentUserId,
        sender: currentUser
      });
    });
  </script>
</body>
</html>
